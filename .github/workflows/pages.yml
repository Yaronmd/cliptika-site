# Publishes only the public website files to GitHub Pages (README.md and .github/ stay out).
# Inactive until the repository's Pages source is set to "GitHub Actions" and this file is on main.
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the public site
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
        run: |
          mkdir _site
          cp index.html privacy.html support.html smart-paste.html lens.html capture-stack.html style.css site.css showcase.css script.js site.js showcase.js analytics.js analytics-config.js favicon.png robots.txt sitemap.xml .nojekyll _site/
          python3 -c 'import json, os, pathlib, re; w=os.environ.get("UMAMI_WEBSITE_ID", ""); u=os.environ.get("UMAMI_SCRIPT_URL", ""); assert not w or re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", w), "Invalid Umami website ID"; assert not u or u.startswith("https://"), "Invalid tracker URL"; pathlib.Path("_site/analytics-config.js").write_text("window.CLIPTIKA_ANALYTICS = " + json.dumps({"websiteId": w, "scriptUrl": u}) + ";")'
          rsync -a --exclude '*.md' assets/ _site/assets/
          test -f _site/assets/og/cliptika-og-v2.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
