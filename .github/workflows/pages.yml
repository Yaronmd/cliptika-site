# Publishes only the public website to GitHub Pages (docs/, tests/, tools/ and *.md stay out).
# Inactive until the repository's Pages source is set to "GitHub Actions" and this file is on main.
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the public site
        run: |
          mkdir _site
          cp index.html privacy.html support.html style.css site.css showcase.css script.js site.js showcase.js favicon.png robots.txt sitemap.xml .nojekyll _site/
          rsync -a --exclude '*.md' assets/ _site/assets/
          test -f _site/assets/og/cliptika-og.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
