<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Official support and privacy information for Cliptika for macOS.">
  <title>Cliptika</title>
  <style>
    :root{color-scheme:light dark;--fg:#1d1d1f;--bg:#fff;--mut:#6e6e73;--ln:#d2d2d7;--ac:#0066cc;--card:#f5f5f7}
    @media(prefers-color-scheme:dark){:root{--fg:#f5f5f7;--bg:#1d1d1f;--mut:#a1a1a6;--ln:#424245;--ac:#2997ff;--card:#2c2c2e}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
    main{max-width:760px;margin:0 auto;padding:72px 20px 80px}
    h1{font-size:44px;line-height:1.05;margin:0 0 14px;letter-spacing:-.03em}
    p{margin:8px 0}.mut{color:var(--mut)}
    .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:36px}
    .card{display:block;padding:22px;border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--fg);text-decoration:none}
    .card strong{display:block;font-size:20px;margin-bottom:4px}.card span{color:var(--mut);font-size:15px}
    footer{border-top:1px solid var(--ln);margin-top:56px;padding-top:16px;color:var(--mut);font-size:14px}
    footer a{color:var(--ac)}
  </style>
</head>
<body>
  <main>
    <h1>Cliptika</h1>
    <p class="mut">A native macOS utility for faster capture, paste, and everyday clipboard workflows.</p>
    <div class="links">
      <a class="card" href="support.html"><strong>Support</strong><span>Setup, permissions, shortcuts, and troubleshooting.</span></a>
      <a class="card" href="privacy.html"><strong>Privacy Policy</strong><span>How Cliptika handles clipboard data, screenshots, and permissions.</span></a>
    </div>
    <footer>&copy; 2026 Yaron Mordechai &middot; <a href="mailto:Ybmg.studio@gmail.com">Ybmg.studio@gmail.com</a></footer>
  </main>
</body>
</html>
